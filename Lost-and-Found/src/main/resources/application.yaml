server:
  port: 5001

spring:
  application:
    name: LOST-AND-FOUND

  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      enabled: true
      max-file-size: 1000MB
      max-request-size: 1000MB

  datasource:
    url: jdbc:mysql://localhost:3306/lostAndFoundDB
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver


#openapi:
#  service:
