#    version: 1.0.0
#    url: http://localhost:5000
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs


apiTitle: "Lost & Found API Documentation"
apiDescription: "Finding Missing Person"
apiVersion: "1.0.0"
apiContactName: "Moinul Islam"
apiContactEmail: "moinulmd306@gmail.com"
apiContactUrl: "https://qryptic.net"

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/